<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FC Online Cup · บอลเดินสาย</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b12; --panel: #0f1622; --panel2: #141d2c; --line: #223047;
    --text: #e8eef8; --muted: #7d8aa3; --accent: #3dff8f; --accent2: #19c2ff;
    --gold: #ffcc33; --red: #ff5470; --radius: 12px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; font-family: 'Kanit', system-ui, sans-serif; color: var(--text); min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(61,255,143,.12), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(25,194,255,.10), transparent 60%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 80px, transparent 80px 160px),
      var(--bg);
  }
  a { color: inherit; }
  button, input, textarea, select { font: inherit; color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
  header.top { display: flex; align-items: center; gap: 14px; padding: 8px 0 20px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 26px; letter-spacing: .5px; text-decoration: none; }
  .logo span { color: var(--accent); text-shadow: 0 0 18px rgba(61,255,143,.5); }
  .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 2px 10px; border-radius: 99px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); }
  .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s infinite; }
  .live.off { color: var(--gold); } .live.off::before { background: var(--gold); box-shadow: none; animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .spacer { flex: 1; }
  .btn { background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #04140a; border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .panel { background: linear-gradient(180deg, var(--panel), #0c121c); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .grid-home { display: grid; grid-template-columns: 420px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .grid-home { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 14px; font-size: 18px; font-weight: 600; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  input[type=text], input[type=number], textarea {
    width: 100%; background: #0a1019; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent2); }
  textarea { min-height: 170px; resize: vertical; line-height: 1.6; }
  .modes { display: grid; gap: 8px; }
  .mode { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: #0a1019; }
  .mode:has(input:checked) { border-color: var(--accent); background: rgba(61,255,143,.06); }
  .mode input { margin-top: 5px; accent-color: var(--accent); }
  .mode b { display: block; font-weight: 600; }
  .mode small { color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: 14px; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .opts input { accent-color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tcard { text-decoration: none; display: block; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; transition: .15s; }
  .tcard:hover { border-color: var(--accent); transform: translateY(-2px); }
  .tcard .n { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
  .tcard .m { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .tcard .c { margin-top: 8px; color: var(--gold); font-size: 14px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(25,194,255,.12); color: var(--accent2); border: 1px solid rgba(25,194,255,.3); }
  .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  .banner { background: rgba(255,204,51,.08); border: 1px solid rgba(255,204,51,.35); color: var(--gold); padding: 10px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }

  /* Tournament view */
  .thead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .thead h1 { margin: 0; font-size: 26px; font-weight: 800; }
  .champ {
    display: flex; align-items: center; gap: 16px; padding: 16px 20px; margin-bottom: 18px; border-radius: var(--radius);
    background: linear-gradient(90deg, rgba(255,204,51,.18), rgba(255,204,51,.02)); border: 1px solid rgba(255,204,51,.45);
  }
  .champ .cup { font-size: 40px; filter: drop-shadow(0 0 12px rgba(255,204,51,.6)); }
  .champ .who { font-size: 24px; font-weight: 800; color: var(--gold); }
  .champ small { color: var(--muted); display: block; }
  .section-title { font-size: 14px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .bracket { display: flex; gap: 28px; overflow-x: auto; padding: 6px 4px 18px; }
  .col { display: flex; flex-direction: column; min-width: 210px; }
  .col .rt { font-size: 12px; color: var(--accent2); margin-bottom: 10px; white-space: nowrap; }
  .col .ms { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 12px; }
  .match {
    position: relative; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: default;
    transition: .15s;
  }
  .match.clickable { cursor: pointer; }
  .match.clickable:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,255,143,.12); }
  .match.ready { border-color: rgba(25,194,255,.55); }
  .match.ghost { visibility: hidden; }
  .match.byeish { opacity: .45; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; gap: 8px; font-size: 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sc { font-weight: 600; min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .row.win { background: rgba(61,255,143,.08); }
  .row.win .nm { color: var(--accent); font-weight: 600; }
  .row.lose .nm { color: var(--muted); }
  .row.tbd .nm { color: #4d5a73; font-style: italic; }
  .pen { font-size: 10px; color: var(--gold); margin-left: 4px; }
  .mid { position: absolute; right: 6px; top: -1px; font-size: 9px; color: #3b4860; }
  .gf .match { border-color: rgba(255,204,51,.4); }

  /* Round robin */
  .rr { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .rr { grid-template-columns: 1fr; } }
  table.st { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.st th { font-weight: 400; color: var(--muted); font-size: 12px; text-align: center; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  table.st td { text-align: center; padding: 9px 4px; border-bottom: 1px solid rgba(34,48,71,.6); font-variant-numeric: tabular-nums; }
  table.st td.tn { text-align: left; font-weight: 600; }
  table.st th.tn { text-align: left; }
  table.st tr:first-child td.pos { color: var(--gold); }
  table.st td.pts { font-weight: 800; color: var(--accent); }
  .pos { width: 28px; color: var(--muted); }
  .form { display: inline-flex; gap: 3px; }
  .form i { width: 16px; height: 16px; border-radius: 4px; font-size: 10px; font-style: normal; display: grid; place-items: center; color: #000; font-weight: 600; }
  .form .W { background: var(--accent); } .form .D { background: #9aa6bd; } .form .L { background: var(--red); }
  .days { display: grid; gap: 12px; }
  .day h3 { margin: 0 0 8px; font-size: 13px; font-weight: 400; color: var(--accent2); }
  .fx { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .fx:hover { border-color: var(--accent); }
  .fx .h { text-align: right; } .fx .s { font-weight: 800; min-width: 54px; text-align: center; color: var(--muted); }
  .fx.done .s { color: var(--text); }
  .fx .w { color: var(--accent); font-weight: 600; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 50; padding: 20px; }
  .modal { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .modal h3 { margin: 0 0 4px; } .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .score { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: center; margin-bottom: 10px; }
  .score .nm { font-weight: 600; }
  .score input { text-align: center; font-size: 22px; font-weight: 800; padding: 8px; }
  .penbox { margin: 8px 0 4px; padding: 10px; border: 1px dashed rgba(255,204,51,.5); border-radius: 10px; font-size: 14px; }
  .penbox label { display: flex; gap: 8px; margin-top: 6px; cursor: pointer; }
  .actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; z-index: 60; font-size: 14px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="#/">⚽ FC ONLINE <span>CUP</span></a>
    <span class="tag">บอลเดินสาย</span>
    <div class="spacer"></div>
    <span id="live" class="live">ออนไลน์ · ทุกคนเห็นเหมือนกัน</span>
  </header>
  <main id="app"></main>
</div>

<script src="bracket.js"></script>
<script>
const $app = document.getElementById('app');
const $live = document.getElementById('live');
const MODE_NAME = { double: 'สายบน-สายล่าง', single: 'แพ้ตกรอบ', rr: 'เก็บคะแนน' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Storage: shared API, falls back to this browser only ---------- */
const store = {
  mode: 'api',
  pin: localStorage.getItem('fc_pin') || '',
  async init() {
    try {
      const r = await fetch('/api/t', { cache: 'no-store' });
      if (!r.ok) throw 0;
      const j = await r.json();
      this.pinRequired = j.pinRequired;
      this._list = j.list;
    } catch { this.mode = 'local'; }
    $live.className = 'live' + (this.mode === 'local' ? ' off' : '');
    $live.textContent = this.mode === 'local' ? 'โหมดออฟไลน์ · เห็นแค่เครื่องนี้' : 'ออนไลน์ · ทุกคนเห็นเหมือนกัน';
  },
  _local() { try { return JSON.parse(localStorage.getItem('fc_local') || '{}'); } catch { return {}; } },
  _saveLocal(db) { localStorage.setItem('fc_local', JSON.stringify(db)); },
  async list() {
    if (this.mode === 'local') {
      return Object.entries(this._local()).map(([id, t]) => ({ id, name: t.name, mode: t.mode, teams: t.teams.length, createdAt: t.createdAt, champion: t.champion }))
        .sort((a, b) => b.createdAt - a.createdAt);
    }
    if (this._list) { const l = this._list; this._list = null; return l; }
    const r = await fetch('/api/t', { cache: 'no-store' });
    return (await r.json()).list;
  },
  async get(id) {
    if (this.mode === 'local') return this._local()[id] || null;
    const r = await fetch('/api/t?id=' + encodeURIComponent(id), { cache: 'no-store' });
    return r.ok ? r.json() : null;
  },
  async post(body) {
    if (this.mode === 'local') return this._localPost(body);
    for (let attempt = 0; attempt < 2; attempt++) {
      const r = await fetch('/api/t', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-pin': this.pin }, body: JSON.stringify(body) });
      if (r.status === 401) {
        const p = prompt('ใส่ PIN สำหรับแก้ไข');
        if (p === null) throw new Error('ยกเลิก');
        this.pin = p.trim(); localStorage.setItem('fc_pin', this.pin);
        continue;
      }
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'error');
      return j;
    }
    throw new Error('PIN ไม่ถูกต้อง');
  },
  _localPost(b) {
    const db = this._local();
    if (b.action === 'create') { const id = Math.random().toString(36).slice(2, 8); db[id] = b.tournament; this._saveLocal(db); return { id }; }
    const t = db[b.id]; if (!t) throw new Error('ไม่พบรายการ');
    if (b.action === 'delete') delete db[b.id];
    if (b.action === 'result') { if (b.result === null) delete t.results[b.matchId]; else t.results[b.matchId] = b.result; }
    if (b.action === 'teams') { t.teams = b.teams; if (b.name) t.name = b.name; }
    if (t && 'champion' in b) t.champion = b.champion;
    if (t) { t.version = (t.version || 0) + 1; t.updatedAt = Date.now(); }
    this._saveLocal(db); return { ok: true };
  },
};

function toast(msg) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

/* ---------- Router ---------- */
let current = null, pollTimer = null, modalOpen = false;
window.addEventListener('hashchange', route);
async function route() {
  clearInterval(pollTimer);
  const m = location.hash.match(/^#\/t\/([\w-]+)/);
  if (m) return showTournament(m[1]);
  current = null;
  showHome();
}

/* ---------- Home ---------- */
async function showHome() {
  $app.innerHTML = `
    ${store.mode === 'local' ? `<div class="banner">ยังไม่ได้ต่อฐานข้อมูล ข้อมูลจะเก็บไว้แค่ในเครื่องนี้ (ดู README วิธีเพิ่ม Upstash Redis บน Vercel)</div>` : ''}
    <div class="grid-home">
      <form class="panel" id="createForm">
        <h2>สร้างรายการแข่งใหม่</h2>
        <label class="f">ชื่อรายการ</label>
        <input type="text" name="name" placeholder="เช่น FC Online Cup ประจำสัปดาห์" maxlength="60" />
        <label class="f">รูปแบบการแข่ง</label>
        <div class="modes">
          <label class="mode"><input type="radio" name="mode" value="double" checked /><div><b>1 · สายบน-สายล่าง</b><small>แพ้ครั้งแรกตกไปสายล่าง แพ้ 2 ครั้งถึงตกรอบ</small></div></label>
          <label class="mode"><input type="radio" name="mode" value="single" /><div><b>2 · แพ้ตกรอบ</b><small>น็อกเอาต์ แพ้ทีเดียวกลับบ้าน ไม่มีสายล่าง</small></div></label>
          <label class="mode"><input type="radio" name="mode" value="rr" /><div><b>3 · เก็บคะแนน</b><small>เจอกันหมดทุกทีม ชนะ 3 เสมอ 1 แพ้ 0</small></div></label>
        </div>
        <label class="f">ชื่อทีม / ผู้เล่น (บรรทัดละ 1 ทีม)</label>
        <textarea name="teams" placeholder="ทีม 1&#10;ทีม 2&#10;ทีม 3&#10;ทีม 4"></textarea>
        <div class="hint" id="teamCount">0 ทีม</div>
        <div class="opts">
          <label><input type="checkbox" name="shuffle" checked /> สุ่มจับสาย</label>
          <label data-for="double"><input type="checkbox" name="reset" checked /> ชิงแชมป์มีรีเซ็ต (สายล่างชนะต้องเตะนัดสอง)</label>
          <label data-for="rr" hidden><input type="checkbox" name="legs" /> เจอกัน 2 นัด (เหย้า-เยือน)</label>
        </div>
        <div class="err" id="createErr"></div>
        <div class="actions"><button class="btn primary" type="submit">สร้างสายแข่ง ⚡</button></div>
      </form>
      <section>
        <h2>รายการทั้งหมด</h2>
        <div id="tlist" class="tlist"><div class="empty">กำลังโหลด...</div></div>
      </section>
    </div>`;

  const f = document.getElementById('createForm');
  const syncOpts = () => {
    const mode = f.mode.value;
    f.querySelectorAll('[data-for]').forEach((el) => (el.hidden = el.dataset.for !== mode));
  };
  f.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', syncOpts));
  const countTeams = () => f.teams.value.split('\n').map((s) => s.trim()).filter(Boolean);
  f.teams.addEventListener('input', () => (document.getElementById('teamCount').textContent = countTeams().length + ' ทีม'));
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('createErr'); err.textContent = '';
    const teams = countTeams();
    if (teams.length < 2) return (err.textContent = 'ต้องมีอย่างน้อย 2 ทีม');
    if (teams.length > 64) return (err.textContent = 'ได้สูงสุด 64 ทีม');
    if (new Set(teams).size !== teams.length) return (err.textContent = 'มีชื่อทีมซ้ำกัน');
    const t = Bracket.create({ name: f.name.value || 'FC Online Cup', mode: f.mode.value, teams, shuffle: f.shuffle.checked, legs: f.legs.checked ? 2 : 1, reset: f.reset.checked });
    try {
      const { id } = await store.post({ action: 'create', tournament: t });
      location.hash = '#/t/' + id;
    } catch (ex) { err.textContent = 'สร้างไม่สำเร็จ: ' + ex.message; }
  });

  const list = await store.list().catch(() => []);
  const el = document.getElementById('tlist');
  el.innerHTML = list.length ? list.map((t) => `
    <a class="tcard" href="#/t/${t.id}">
      <div class="n">${esc(t.name)}</div>
      <div class="m"><span class="badge">${MODE_NAME[t.mode]}</span><span>${t.teams} ทีม</span><span>${new Date(t.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}</span></div>
      ${t.champion ? `<div class="c">🏆 ${esc(t.champion)}</div>` : ''}
    </a>`).join('') : `<div class="empty">ยังไม่มีรายการ สร้างอันแรกเลย</div>`;
}

/* ---------- Tournament ---------- */
async function showTournament(id) {
  $app.innerHTML = `<div class="empty">กำลังโหลด...</div>`;
  const t = await store.get(id);
  if (!t) { $app.innerHTML = `<div class="empty">ไม่พบรายการนี้ <a href="#/">กลับหน้าแรก</a></div>`; return; }
  current = { id, t };
  renderTournament();
  if (store.mode === 'api') {
    pollTimer = setInterval(async () => {
      if (modalOpen || !current || current.id !== id || document.hidden) return;
      const fresh = await store.get(id).catch(() => null);
      if (fresh && fresh.version !== current.t.version) { current.t = fresh; renderTournament(); }
    }, 3000);
  }
}

const teamName = (t, x) => (x === Bracket.BYE ? 'BYE' : x === null || x === undefined ? null : t.teams[x]);

function renderTournament() {
  const { t } = current;
  const R = Bracket.resolve(t);
  current.R = R;
  const champName = R.champion !== null ? t.teams[R.champion] : null;
  if ((t.champion ?? null) !== champName) syncChampion(champName);

  const played = Object.values(R.all).filter((m) => m.status === 'done').length;
  const total = Object.values(R.all).filter((m) => m.status !== 'bye' && m.status !== 'skip').length;

  let body = '';
  if (t.mode === 'rr') body = renderRR(t, R);
  else {
    const cols = (br) => {
      const out = [];
      for (let r = 1; r <= t.rounds[br]; r++) out.push({ label: Bracket.roundLabel(t, br, r), ms: t.matches.filter((m) => m.br === br && m.round === r) });
      return out;
    };
    if (t.mode === 'single') body = bracketHTML(t, R, cols('W'));
    else {
      const gf = t.matches.filter((m) => m.br === 'GF' && R.all[m.id].status !== 'skip');
      body = `<div class="section-title">สายบน</div>${bracketHTML(t, R, cols('W'))}
              <div class="section-title">สายล่าง</div>${bracketHTML(t, R, cols('L'))}
              <div class="section-title">ชิงแชมป์</div><div class="gf">${bracketHTML(t, R, gf.map((m) => ({ label: Bracket.roundLabel(t, 'GF', m.round), ms: [m] })))}</div>`;
    }
  }

  $app.innerHTML = `
    <div class="thead">
      <a class="btn small" href="#/">← กลับ</a>
      <h1>${esc(t.name)}</h1>
      <span class="badge">${MODE_NAME[t.mode]}</span>
      <span class="tag">${t.teams.length} ทีม · เตะแล้ว ${played}/${total}</span>
      <div class="spacer"></div>
      <button class="btn small" id="editTeams">✏️ แก้ชื่อทีม</button>
      <button class="btn small" id="copyLink">🔗 คัดลอกลิงก์</button>
      <button class="btn small danger" id="delT">ลบ</button>
    </div>
    ${champName ? `<div class="champ"><div class="cup">🏆</div><div><small>แชมป์</small><div class="who">${esc(champName)}</div>${R.runnerUp !== null ? `<small>รองแชมป์: ${esc(t.teams[R.runnerUp])}</small>` : ''}</div></div>` : ''}
    ${body}
    <p class="hint">กดที่คู่แข่งเพื่อใส่ผล · ถ้าเสมอในรอบน็อกเอาต์ให้เลือกคนชนะจุดโทษ · หน้านี้อัปเดตเองทุก 3 วินาที</p>`;

  $app.querySelectorAll('[data-mid]').forEach((el) => el.addEventListener('click', () => openScore(el.dataset.mid)));
  document.getElementById('editTeams').onclick = openTeams;
  document.getElementById('copyLink').onclick = () => { navigator.clipboard?.writeText(location.href); toast('คัดลอกลิงก์แล้ว'); };
  document.getElementById('delT').onclick = async () => {
    if (!confirm(`ลบรายการ "${t.name}" ถาวร?`)) return;
    try { await store.post({ action: 'delete', id: current.id }); location.hash = '#/'; } catch (e) { toast('ลบไม่สำเร็จ: ' + e.message); }
  };
}

async function syncChampion(name) {
  current.t.champion = name;
  // record champion in the list only; harmless if it fails (e.g. viewer without PIN)
  if (store.mode === 'local') { const db = store._local(); if (db[current.id]) { db[current.id].champion = name; store._saveLocal(db); } }
}

function matchHTML(t, R, m) {
  const r = R.all[m.id];
  if (r.status === 'bye' && r.a === Bracket.BYE && r.b === Bracket.BYE) return `<div class="match ghost"><div class="row">-</div><div class="row">-</div></div>`;
  const row = (x, s, side) => {
    const nm = teamName(t, x);
    const cls = nm === null ? 'tbd' : r.winner !== null && r.winner !== Bracket.BYE ? (r.winner === x ? 'win' : 'lose') : '';
    const pen = r.status === 'done' && r.s1 === r.s2 && r.pw === side ? '<span class="pen">PEN</span>' : '';
    return `<div class="row ${cls}"><span class="nm">${nm === null ? 'รอผล...' : esc(nm)}${pen}</span><span class="sc">${s ?? ''}</span></div>`;
  };
  const clickable = r.status === 'ready' || r.status === 'done';
  return `<div class="match ${r.status} ${r.status === 'bye' ? 'byeish' : ''} ${clickable ? 'clickable' : ''}" ${clickable ? `data-mid="${m.id}"` : ''}>
    ${row(r.a, r.s1, 'a')}${row(r.b, r.s2, 'b')}</div>`;
}

function bracketHTML(t, R, cols) {
  return `<div class="bracket">${cols.map((c) => `
    <div class="col"><div class="rt">${esc(c.label)}</div><div class="ms">${c.ms.map((m) => matchHTML(t, R, m)).join('')}</div></div>`).join('')}</div>`;
}

function renderRR(t, R) {
  const st = Bracket.standings(t, R.all);
  const table = `<div class="panel"><h2>ตารางคะแนน</h2><table class="st">
    <tr><th class="pos">#</th><th class="tn">ทีม</th><th>เล่น</th><th>ชนะ</th><th>เสมอ</th><th>แพ้</th><th>ได้</th><th>เสีย</th><th>+/-</th><th>แต้ม</th><th>ฟอร์ม</th></tr>
    ${st.map((s, i) => `<tr><td class="pos">${i + 1}</td><td class="tn">${esc(t.teams[s.team])}</td><td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf}</td><td>${s.ga}</td><td>${s.gd > 0 ? '+' : ''}${s.gd}</td><td class="pts">${s.pts}</td>
      <td><span class="form">${s.form.slice(-5).map((f) => `<i class="${f}">${{ W: 'W', D: 'D', L: 'L' }[f]}</i>`).join('')}</span></td></tr>`).join('')}
  </table></div>`;
  const days = [];
  for (let r = 1; r <= t.rounds.R; r++) {
    const ms = t.matches.filter((m) => m.round === r);
    days.push(`<div class="day"><h3>${Bracket.roundLabel(t, 'R', r)}</h3>${ms.map((m) => {
      const x = R.all[m.id];
      const done = x.status === 'done';
      const wa = done && x.s1 > x.s2, wb = done && x.s2 > x.s1;
      return `<div class="fx ${done ? 'done' : ''}" data-mid="${m.id}"><span class="h ${wa ? 'w' : ''}">${esc(t.teams[x.a])}</span><span class="s">${done ? `${x.s1} - ${x.s2}` : 'vs'}</span><span class="${wb ? 'w' : ''}">${esc(t.teams[x.b])}</span></div>`;
    }).join('')}</div>`);
  }
  return `<div class="rr">${table}<div class="panel"><h2>โปรแกรมการแข่ง</h2><div class="days">${days.join('')}</div></div></div>`;
}

/* ---------- Modals ---------- */
function modal(html, onMount) {
  modalOpen = true;
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  const close = () => { bg.remove(); modalOpen = false; };
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  onMount(bg, close);
}

function openScore(mid) {
  const { t, R } = current;
  const m = t.matches.find((x) => x.id === mid);
  const r = R.all[mid];
  const ko = m.br !== 'R';
  const label = m.br === 'R' ? Bracket.roundLabel(t, 'R', m.round) : Bracket.roundLabel(t, m.br, m.round);
  modal(`
    <h3>ใส่ผลการแข่ง</h3><div class="sub">${esc(label)}</div>
    <div class="score"><span class="nm">${esc(t.teams[r.a])}</span><input type="number" min="0" max="99" id="s1" value="${r.s1 ?? ''}" inputmode="numeric" /></div>
    <div class="score"><span class="nm">${esc(t.teams[r.b])}</span><input type="number" min="0" max="99" id="s2" value="${r.s2 ?? ''}" inputmode="numeric" /></div>
    ${ko ? `<div class="penbox" id="pen" hidden>เสมอ — ใครชนะจุดโทษ?
      <label><input type="radio" name="pw" value="a" ${r.pw === 'a' ? 'checked' : ''}/> ${esc(t.teams[r.a])}</label>
      <label><input type="radio" name="pw" value="b" ${r.pw === 'b' ? 'checked' : ''}/> ${esc(t.teams[r.b])}</label></div>` : ''}
    <div class="err" id="sErr"></div>
    <div class="actions">
      ${r.status === 'done' ? `<button class="btn danger" id="clr">ล้างผล</button>` : ''}
      <div class="spacer"></div>
      <button class="btn" id="cancel">ยกเลิก</button>
      <button class="btn primary" id="save">บันทึก</button>
    </div>`, (root, close) => {
    const s1 = root.querySelector('#s1'), s2 = root.querySelector('#s2'), pen = root.querySelector('#pen');
    const sync = () => { if (pen) pen.hidden = !(s1.value !== '' && s1.value === s2.value); };
    s1.addEventListener('input', sync); s2.addEventListener('input', sync); sync();
    s1.focus(); s1.select();
    root.querySelector('#cancel').onclick = close;
    const send = async (result) => {
      try {
        const results = { ...current.t.results };
        if (result === null) delete results[mid]; else results[mid] = result;
        const champ = Bracket.resolve({ ...current.t, results }).champion;
        const champion = champ !== null ? current.t.teams[champ] : null;
        await store.post({ action: 'result', id: current.id, matchId: mid, result, champion });
        current.t.results = results; current.t.champion = champion;
        current.t.version = (current.t.version || 0) + 1;
        close(); renderTournament();
      } catch (e) { root.querySelector('#sErr').textContent = 'บันทึกไม่สำเร็จ: ' + e.message; }
    };
    root.querySelector('#save').onclick = () => {
      const a = parseInt(s1.value, 10), b = parseInt(s2.value, 10);
      if (!Number.isFinite(a) || !Number.isFinite(b) || a < 0 || b < 0) return (root.querySelector('#sErr').textContent = 'ใส่สกอร์ให้ครบ');
      let pw = null;
      if (ko && a === b) {
        pw = root.querySelector('input[name=pw]:checked')?.value || null;
        if (!pw) return (root.querySelector('#sErr').textContent = 'เสมอกัน เลือกคนชนะจุดโทษด้วย');
      }
      send({ ta: r.a, tb: r.b, s1: a, s2: b, pw });
    };
    root.addEventListener('keydown', (e) => { if (e.key === 'Enter') root.querySelector('#save').click(); if (e.key === 'Escape') close(); });
    const clr = root.querySelector('#clr');
    if (clr) clr.onclick = () => send(null);
  });
}

function openTeams() {
  const { t } = current;
  modal(`
    <h3>แก้ชื่อรายการ / ชื่อทีม</h3><div class="sub">แก้ชื่อได้ สายแข่งกับผลเดิมยังอยู่ครบ (บรรทัดละ 1 ทีม ต้องมี ${t.teams.length} บรรทัด)</div>
    <label class="f">ชื่อรายการ</label><input type="text" id="tn" value="${esc(t.name)}" maxlength="60" />
    <label class="f">ชื่อทีม</label><textarea id="tt">${esc(t.teams.join('\n'))}</textarea>
    <div class="err" id="tErr"></div>
    <div class="actions"><button class="btn" id="cancel">ยกเลิก</button><button class="btn primary" id="save">บันทึก</button></div>`, (root, close) => {
    root.querySelector('#cancel').onclick = close;
    root.querySelector('#save').onclick = async () => {
      const teams = root.querySelector('#tt').value.split('\n').map((s) => s.trim()).filter(Boolean);
      const err = root.querySelector('#tErr');
      if (teams.length !== t.teams.length) return (err.textContent = `ต้องมี ${t.teams.length} ทีมเท่าเดิม (ตอนนี้ ${teams.length})`);
      if (new Set(teams).size !== teams.length) return (err.textContent = 'มีชื่อทีมซ้ำกัน');
      const name = root.querySelector('#tn').value.trim() || t.name;
      const champ = current.R.champion;
      try {
        await store.post({ action: 'teams', id: current.id, teams, name, champion: champ !== null ? teams[champ] : null });
        current.t.teams = teams; current.t.name = name; current.t.version++;
        close(); renderTournament();
      } catch (e) { err.textContent = 'บันทึกไม่สำเร็จ: ' + e.message; }
    };
  });
}

store.init().then(route);
</script>
</body>
</html>
